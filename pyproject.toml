[project]
name = "transcribe"
version = "1.6.0"
description = "Voice transcription app with global hotkey — supports Linux, macOS, and Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
# Full (standalone/host) installs: audio capture + transcription.
linux = [
    "sounddevice",
    "soundfile",
    "numpy",
    "scipy",
    "nemo_toolkit[asr]",
    "python-xlib",
    "evdev",
]
macos = [
    "sounddevice",
    "soundfile",
    "numpy",
    "scipy",
    "mlx-whisper",
    "pynput",
]
windows = [
    "sounddevice",
    "soundfile",
    "numpy",
    "scipy",
    "nemo_toolkit[asr]",
    "pynput",
]
# Client-only installs: hotkey + paste, no audio stack, no GPU.
client-linux = [
    "python-xlib",
    "evdev",
]
client-macos = [
    "pynput",
]

[project.scripts]
transcribe = "transcribe.app:main"

[tool.commitizen]
version = "1.6.0"
version_files = [
    "__version__.py",
    "pyproject.toml:version",
]
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "pre-commit",
    "numpy",
]